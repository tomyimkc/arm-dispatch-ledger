# SPDX-License-Identifier: Apache-2.0
#
# verify-free-arm64.yml — the judge-reproducible lane.
#
# Runs on GitHub's FREE hosted `ubuntu-24.04-arm` runner (Neoverse-N2 class).
# This is deliberately the most important lane in this repo: a judge can
# fork the repository, click "Run workflow" (or just open a PR), and get
# the full dispatch ledger without owning any Arm hardware or paying for
# compute. Every other lane in .github/workflows/ demonstrates something
# extra (Apple Silicon SME2, DGX Spark Cortex-X925) that this lane cannot,
# but this is the one that must always be green and always reproducible by
# a stranger.
#
# SECURITY: this workflow is safe to run on `pull_request` (including from
# forks) because ubuntu-24.04-arm is a GitHub-HOSTED, ephemeral runner with
# no access to repository secrets beyond the default (read-only for forked
# PRs) GITHUB_TOKEN, and no access to any of this project's physical
# machines. Contrast with verify-macos-arm64.yml and
# verify-spark-aarch64.yml, which run on self-hosted runners and therefore
# deliberately do NOT trigger on pull_request / pull_request_target (see the
# security comments in those files).
#
# Finding 2 (SVE unreachable at 128-bit): Neoverse-N2 implements SVE2 at
# 128-bit, below KleidiAI's `ggml_cpu_get_sve_cnt() == QK8_0` (256-bit) gate,
# so the SVE kernel family can never be selected on this runner. That is an
# expected, correct architectural result — not a bug in this workflow or in
# this repo's kernels — so the dispatch-verification step below is marked
# `continue-on-error: true` and never gates the job. See
# results/GROUND-TRUTH-DISPATCH.md (written by tools/verify_dispatch.py's
# sibling research) for the full corrected dispatch rule.

name: verify-free-arm64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-free-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, verify dispatch, bench (Neoverse-N2, free hosted)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # cmake/build-essential: build llama.cpp + kernels/.
          # curl: model download.
          # python3: tools/verify_dispatch.py, tools/bench.py, tools/plot_results.py
          #   (all stdlib-only -- confirmed by reading their imports -- so no pip
          #   install step is needed).
          # gdb: the Linux L3 (DISPATCH) debugger tools/verify_dispatch.py drives
          #   (lldb is Darwin-only; verify_dispatch.py's --l3-debugger=auto picks
          #   gdb here).
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential curl python3 gdb ca-certificates

      - name: Compute cache keys and paths
        id: vars
        run: |
          # CACHE_DIR is exported via $GITHUB_ENV (so every later step in
          # this job sees it), rather than a job-level `env:` block, because
          # the `runner` context (needed for $RUNNER_TEMP) is not available
          # inside an `env:` mapping at all — workflow- or job-level — only
          # inside `run:`/`with:` steps. Confirmed with
          # `actionlint .github/workflows/*.yml`, which flagged the
          # job-level `env:` approach tried first.
          echo "CACHE_DIR=${RUNNER_TEMP}/adl-cache" >>"$GITHUB_ENV"
          source scripts/common.sh
          echo "llama_cpp_ref=${LLAMA_CPP_REF}" >>"$GITHUB_OUTPUT"
          echo "hf_file_sha256=${HF_FILE_SHA256}" >>"$GITHUB_OUTPUT"

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/adl-cache/llama.cpp
          key: llamacpp-${{ runner.os }}-${{ runner.arch }}-${{ steps.vars.outputs.llama_cpp_ref }}-kleidiai-v1

      - name: Cache model download
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/adl-cache/models
          key: model-${{ steps.vars.outputs.hf_file_sha256 }}-v1

      - name: Build llama.cpp (KleidiAI)
        run: bash scripts/lib/build_llamacpp.sh

      - name: Download GGUF model
        run: bash scripts/lib/fetch_model.sh

      - name: Build kernels
        run: bash scripts/lib/build_kernels.sh

      - name: Capture hardware features
        run: bash scripts/lib/capture_hw_features.sh

      - name: Run correctness tests
        run: bash scripts/lib/run_correctness_tests.sh

      - name: L3 gdb probe ground-truth test
        # Gates the dispatch verifier itself against a known call count before we
        # trust any number it produces below. The first revision of the gdb probe
        # silently reported 0 hits for every config on this exact runner (run
        # 30861845179) because `rbreak` cannot create pending breakpoints for a
        # dlopen'd backend. This test would have caught that immediately, so it is
        # deliberately NOT continue-on-error: an uninstrumented probe must fail the
        # build, never quietly emit zeros.
        run: bash tests/l3_gdb_groundtruth/run_test.sh 7

      - name: Verify dispatch (thread sweep)
        # See the Finding 2 note in the file header: a Neoverse-N2-specific
        # non-engagement of the SVE path is an expected result, recorded in
        # the ledger, never a reason to fail this job.
        continue-on-error: true
        run: bash scripts/lib/verify_dispatch.sh

      - name: Run reduced bench
        run: bash scripts/lib/run_bench.sh

      - name: Emit ledger
        if: always()
        run: bash scripts/lib/emit_ledger.sh

      - name: Write ledger to job summary
        if: always()
        run: |
          if [[ -f results/LEDGER.md ]]; then
            cat results/LEDGER.md >>"$GITHUB_STEP_SUMMARY"
          else
            echo "no results/LEDGER.md produced this run" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results/ artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-dispatch-ledger-results-free-arm64
          # Upload ONLY what this run generated. A bare `path: results/` also sweeps up
          # the committed Apple M4 Max results, so the "free-arm64" artifact ends up
          # containing hw-features-Darwin-arm64.txt and an M4 Max bench table -- which
          # reads as though a Neoverse-N2 runner produced Apple Silicon numbers.
          # Evidence provenance is the whole point here; keep the lanes separate.
          path: |
            results/*Linux*
            results/*aarch64*
            results/LEDGER.md
            results/stage-status.tsv
            results/bench/bench-aarch64.*
            results/logs/
            !results/*[Dd]arwin*
            !results/*apple*
            !results/bench/*apple*
          if-no-files-found: error
          retention-days: 30
